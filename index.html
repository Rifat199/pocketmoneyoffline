    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD3PLE0MU4IXFGuVqk-ZQgnlw0wGMYtKrw",
        authDomain: "poket-money-fc0ff.firebaseapp.com",
        databaseURL: "https://poket-money-fc0ff-default-rtdb.firebaseio.com",
        projectId: "poket-money-fc0ff",
        storageBucket: "poket-money-fc0ff.firebasestorage.app",
        messagingSenderId: "131213229962",
        appId: "1:131213229962:web:036f58cfa32a2fd8375273"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

        const provider = new GoogleAuthProvider();
// নিচের লাইনটি যোগ করুন যাতে আপনার নতুন Client ID টি কাজ করে
provider.setCustomParameters({
  'client_id': '389392910051-4do64nehv992gdohqv4bb8ekoemnaesc.apps.googleusercontent.com'
});

    

    // ১. অফলাইন পারসিস্টেন্স (এটিই ডাটা ডাউনলোড করে সেভ করে রাখে)
    enableIndexedDbPersistence(db).catch((err) => {
        if (err.code == 'failed-precondition') {
            console.warn("একাধিক ট্যাবে অ্যাপ খোলা থাকলে অফলাইন কাজ করবে না।");
        } else if (err.code == 'unimplemented') {
            console.warn("এই ব্রাউজারে অফলাইন সাপোর্ট নেই।");
        }
    });

    let currentFilter = 'today';
    let allHistory = [];
    let currentAddType = 'income';

    window.showToast = (message, type = 'success') => {
        const toast = document.getElementById('customToast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        toastMsg.innerText = message;
        toast.className = `toast-container show ${type}`;
        toastIcon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('display-name').innerHTML = `<i class="fa-solid fa-gem"></i> ${user.displayName}`;
            loadData(user.uid);
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    // ২. রিয়েল টাইম ডাটা লোড (অনলাইন হওয়ার সাথে সাথে সব ডাটা অটোমেটিক সিঙ্ক হবে)
    function loadData(uid) {
        const q = query(collection(db, "users", uid, "history"), orderBy("date", "desc"));
        
        // onSnapshot নিজে থেকেই ডাটা ক্যাশ (Cache) করে রাখে
        onSnapshot(q, (snapshot) => {
            allHistory = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                data.id = doc.id;
                allHistory.push(data);
            });
            processAndDisplay();
            // যদি হিস্টরি মোডাল খোলা থাকে তবে আপডেট হবে
            if (document.getElementById('historyModal').style.display === "flex") {
                renderFilteredHistory();
            }
        });
    }

    window.saveData = () => {
        const amount = document.getElementById('inputAmount').value;
        const note = document.getElementById('inputNote').value;
        const saveBtn = document.getElementById('saveBtn');
        const user = auth.currentUser;

        if (!amount || isNaN(amount) || amount <= 0) { showToast("সঠিক পরিমাণ লিখুন!", "error"); return; }
        if (!note.trim()) { showToast("বিবরণ লিখুন!", "error"); return; }

        if (user) {
            // ডাবল ক্লিক প্রোটেকশন
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>...';

            // সার্ভারে পাঠানোর কমান্ড (অফলাইন থাকলে এটি কিউতে জমা থাকবে)
            addDoc(collection(db, "users", user.uid, "history"), {
                type: currentAddType, 
                amount: parseInt(amount), 
                note: note, 
                date: new Date().toISOString()
            });

            // ৩. অফলাইনে থাকলেও সাথে সাথে বক্স বন্ধ হবে এবং পপআপ আসবে
            showToast("সফলভাবে সেভ হয়েছে!");
            closeAddModal();
            document.getElementById('inputAmount').value = "";
document.getElementById('inputNote').value = "";

            setTimeout(() => { 
                saveBtn.disabled = false; 
                saveBtn.innerHTML = '<i class="fa-solid fa-check-circle"></i> নিশ্চিত করুন';
            }, 1000);
        }
    };

    window.processAndDisplay = () => {
        let filteredIncome = 0, filteredExpense = 0, totalIncomeAllTime = 0, totalExpenseAllTime = 0;
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        
        allHistory.forEach(item => {
            const itemDateObj = new Date(item.date);
            const itemTime = itemDateObj.getTime();
            const amount = parseInt(item.amount) || 0;
            if(item.type === 'income') totalIncomeAllTime += amount; else totalExpenseAllTime += amount;

            let isMatch = false;
            if (currentFilter === 'today' && itemDateObj.toDateString() === now.toDateString()) isMatch = true;
            else if (currentFilter === 'week' && itemTime >= todayStart - (7*24*60*60*1000)) isMatch = true;
            else if (currentFilter === 'month' && itemTime >= todayStart - (30*24*60*60*1000)) isMatch = true;
            else if (currentFilter === 'year' && itemTime >= todayStart - (365*24*60*60*1000)) isMatch = true;
            else if (currentFilter === 'total') isMatch = true;

            if (isMatch) { if(item.type === 'income') filteredIncome += amount; else filteredExpense += amount; }
        });

        const absoluteBalance = totalIncomeAllTime - totalExpenseAllTime;
        document.querySelectorAll('.val')[0].innerText = absoluteBalance;
        document.querySelectorAll('.val')[1].innerText = filteredIncome;
        document.querySelectorAll('.val')[2].innerText = filteredExpense;
        document.querySelectorAll('.big-val')[0].innerText = absoluteBalance;
        document.querySelectorAll('.big-val')[1].innerText = filteredIncome;
        document.querySelectorAll('.big-val')[2].innerText = filteredExpense;
        
        const totalSum = Math.abs(filteredIncome) + Math.abs(filteredExpense) || 1;
        updateMultiCircle((absoluteBalance/totalSum)*100, (filteredIncome/totalSum)*100, (filteredExpense/totalSum)*100);
    };

    // ৪. হিস্টরি দেখার পূর্ণাঙ্গ লজিক
    window.renderFilteredHistory = () => {
        const list = document.getElementById('historyList');
        const m = document.getElementById('historyMonth').value;
        const y = document.getElementById('historyYear').value;
        list.innerHTML = "";

        const filtered = allHistory.filter(item => {
            const d = new Date(item.date);
            return d.getMonth() == m && d.getFullYear() == y;
        });

        if (filtered.length === 0) {
            list.innerHTML = "<p style='text-align:center; padding:20px; color:#999;'>কোন তথ্য নেই</p>";
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.type}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div><strong>${item.note}</strong><br><small>${new Date(item.date).toLocaleDateString('en-GB')}</small></div>
                    <div><strong>${item.type === 'income' ? '+' : '-'} ${item.amount}</strong></div>
                </div>`;
            list.appendChild(div);
        });
    };

    window.updateMonthDropdown = () => {
    const monthNames = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
    const mSel = document.getElementById('historyMonth');
    const ySel = document.getElementById('historyYear');
    const now = new Date();
    
    // ১. ইউজারের সবচেয়ে পুরানো ডাটার তারিখ খুঁজে বের করা (রেজিস্ট্রেশন মাস/বছর)
    let firstDate = now; 
    if (allHistory.length > 0) {
        // হিস্টরি থেকে সবচেয়ে পুরানো তারিখটি বের করা
        const dates = allHistory.map(h => new Date(h.date).getTime());
        firstDate = new Date(Math.min(...dates));
    }

    const startYear = firstDate.getFullYear();
    const startMonth = firstDate.getMonth();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();

    // ২. বছর ড্রপডাউন তৈরি (রেজিস্ট্রেশন বছর থেকে বর্তমান বছর পর্যন্ত)
    const selectedYear = parseInt(ySel.value) || currentYear;
    ySel.innerHTML = "";
    for (let y = currentYear; y >= startYear; y--) {
        ySel.innerHTML += `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`;
    }

    // ৩. মাস ড্রপডাউন তৈরি
    const viewYear = parseInt(ySel.value);
    const selectedMonth = mSel.value !== "" ? parseInt(mSel.value) : currentMonth;
    mSel.innerHTML = "";

    monthNames.forEach((n, i) => {
        let isVisible = true;
        
        // যদি সিলেক্ট করা বছর শুরুর বছর হয়, তবে শুরুর মাসের আগের মাসগুলো দেখাবে না
        if (viewYear === startYear && i < startMonth) isVisible = false;
        
        // যদি সিলেক্ট করা বছর বর্তমান বছর হয়, তবে বর্তমান মাসের পরের মাসগুলো দেখাবে না
        if (viewYear === currentYear && i > currentMonth) isVisible = false;

        if (isVisible) {
            mSel.innerHTML += `<option value="${i}" ${i === selectedMonth ? 'selected' : ''}>${n}</option>`;
        }
    });

    // যদি বর্তমান সিলেক্ট করা মাস নতুন ফিল্টারে না থাকে, তবে প্রথম এভেলেবল মাস সিলেক্ট হবে
    if (mSel.value === "" && mSel.options.length > 0) {
        mSel.selectedIndex = 0;
    }
};


    window.showHistory = () => {
        document.getElementById('historyModal').style.display = "flex";
        updateMonthDropdown();
        renderFilteredHistory();
    };

    window.setFilter = (filter, btn) => {
        currentFilter = filter;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        processAndDisplay();
    };
    window.addMoney = (t) => {
        currentAddType = t;
        document.getElementById('modalTitle').innerText = t === 'income' ? "ইনকাম যোগ" : "খরচ যোগ";
        document.getElementById('addModal').style.display = "flex";
    };
    window.closeAddModal = () => document.getElementById('addModal').style.display = "none";
    window.closeHistory = () => document.getElementById('historyModal').style.display = "none";
    window.login = () => signInWithPopup(auth, provider);
    window.logout = () => document.getElementById('logoutModal').style.display = "flex";
    window.closeLogoutModal = () => document.getElementById('logoutModal').style.display = "none";
    window.confirmLogout = () => { signOut(auth); closeLogoutModal(); };
</script>

}

    <script>
        const circumference = 2 * Math.PI * 48;
        function updateMultiCircle(balancePerc, incomePerc, expensePerc) {
            const rBalance = document.getElementById('ringBalance');
            const rIncome = document.getElementById('ringIncome');
            const rExpense = document.getElementById('ringExpense');
            if(rBalance) rBalance.style.strokeDashoffset = circumference - (Math.min(Math.abs(balancePerc), 100) / 100 * circumference);
            if(rIncome) rIncome.style.strokeDashoffset = circumference - (Math.min(incomePerc, 100) / 100 * circumference);
            if(rExpense) rExpense.style.strokeDashoffset = circumference - (Math.min(expensePerc, 100) / 100 * circumference);
        }
    </script>
